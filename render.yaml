databases:
  - name: contact-db
    databaseName: contact_db
    user: contact_app
    plan: free

services:
  - type: web
    name: contact-backend
    env: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: free
    healthCheckPath: /api/contacts
    envVars:
      - key: DB_HOST
        fromDatabase:
          name: contact-db
          property: host
      - key: DB_PORT
        fromDatabase:
          name: contact-db
          property: port
      - key: DB_NAME
        fromDatabase:
          name: contact-db
          property: database
      - key: DB_USERNAME
        fromDatabase:
          name: contact-db
          property: user
      - key: DB_PASSWORD
        fromDatabase:
          name: contact-db
          property: password
      - key: CORS_ALLOWED_ORIGINS
        value: https://contact-frontend.onrender.com

  - type: web
    name: contact-frontend
    env: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: ./dist
    envVars:
      - key: VITE_API_BASE_URL
        value: https://contact-backend.onrender.com/api/contacts
